name: app

# Flutter app only: analysis, unit tests, debug/release/demo APKs, 16 KB page alignment and
# Android emulator checks. No cloud credential, no secret, no deployment: nothing here talks to
# AWS (CINAF, JobMinutes and Candidature Express are never touched), nothing is uploaded to S3
# (content/ is only copied into the demo APK).

on:
  push:
    paths:
      - "app/**"
      - "content/audio/**"
      - "content/videos/**"
      - "content/images/**"
      - "medias-test/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "content/audio/**"
      - "content/videos/**"
      - "content/images/**"
      - "medias-test/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8
  DEMO_PACKAGE: be.cinaf.eventide.demo

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # medias-test/ is third-party test material (non-distributable): it must never be
      # committed under content/ (S3) or app/assets/ (every APK).
      - name: Test-only media stay out of content/ and app/assets/
        run: bash tool/ci/check_test_media.sh

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Proves that the Kotlin code (alarms, receivers, Play Integrity) and the Gradle setup
      # compile: this cannot be checked in environments without Google Maven access.
      - name: Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: eventide-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Release builds (R8 shrinking, like production). Without android/key.properties they are
  # signed with the debug key: fine for a phone or an emulator, refused by Google Play.
  release-apks:
    name: Release APKs (production and demo)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Same debug key from one run to the next, so that a new demo APK installs over the
      # previous one on the phone (otherwise Android asks to uninstall it first). Not a release
      # key: production signing only ever comes from android/key.properties, never from CI.
      - name: Debug signing key (stable across runs)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eventide-ci-debug-keystore-v1

      - name: Dependencies
        run: flutter pub get

      - name: Production release APKs (arm64-v8a, x86_64)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
          mkdir -p ../dist/production
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/production/eventide-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../dist/production/eventide-x86_64-release.apk

      - name: Production APK has no Premium audio or video, no test media, package be.cinaf.eventide
        run: |
          for apk in ../dist/production/*.apk; do
            bash tool/ci/check_apk_contents.sh production "$apk"
          done

      # The demo bundles every Premium sound, music, landscape video and poster
      # (ContentRepository prefers bundled assets), so that it works without the API, plus the
      # third-party test-only landscape videos of medias-test/ (non-distributable, internal
      # tests on the owner's phone). Never done for the production build above.
      - name: Bundle the Premium audio and landscape media (demo build only)
        run: bash tool/ci/bundle_demo_media.sh

      - name: Demo release APKs (« Eventide Démo », be.cinaf.eventide.demo)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 \
            --dart-define=DEMO_MODE=true --android-project-arg=eventide.demo=true
          mkdir -p ../dist/demo-phone ../dist/demo-emulator
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/demo-phone/eventide-demo-galaxy-s24-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../dist/demo-emulator/eventide-demo-emulator-x86_64.apk

      - name: Demo APKs bundle the Premium audio and landscape media, package be.cinaf.eventide.demo
        run: |
          bash tool/ci/check_apk_contents.sh demo ../dist/demo-phone/eventide-demo-galaxy-s24-arm64.apk
          bash tool/ci/check_apk_contents.sh demo ../dist/demo-emulator/eventide-demo-emulator-x86_64.apk

      # The file the product owner installs on the Galaxy S24 (arm64).
      - uses: actions/upload-artifact@v4
        with:
          name: eventide-demo-galaxy-s24-arm64
          path: dist/demo-phone/eventide-demo-galaxy-s24-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: eventide-demo-emulator-x86_64
          path: dist/demo-emulator/eventide-demo-emulator-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: eventide-production-release-apks-debug-signed
          path: dist/production/*.apk
          if-no-files-found: error
          retention-days: 14

  # Android 15+ phones and Google Play (apps targeting API 35+) require native libraries
  # aligned on 16 KB pages: ELF LOAD segments and the uncompressed libraries in the APK zip.
  page-alignment:
    name: 16 KB page alignment
    needs: release-apks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Demo release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: eventide-demo-*
          path: apks

      - name: Production release APKs
        uses: actions/download-artifact@v4
        with:
          name: eventide-production-release-apks-debug-signed
          path: apks/production

      - name: ELF LOAD alignment and zipalign -P 16 (arm64-v8a, x86_64)
        run: |
          mapfile -t apks < <(find apks -name '*.apk' | sort)
          printf '%s\n' "${apks[@]}"
          bash app/tool/ci/check_16kb_alignment.sh "${apks[@]}"

  # Real Android systems (x86_64 emulators, KVM): Android 14 (API 34) and 16 (API 36), the
  # layout of a 1080 x 2400 screen at 420 dpi (411 x 914 dp) close to the Galaxy S24 (1080 x 2340).
  emulator:
    name: Emulator API ${{ matrix.api-level }}
    needs: release-apks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    env:
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
      AVD_PROFILE: pixel_7
      # Same options for the snapshot and the checks (a snapshot only loads with the same GPU
      # mode). swangle_indirect (ANGLE on SwiftShader) instead of swiftshader_indirect: with
      # the latter the emulator froze, then exited silently 35 to 55 s into our Flutter app, on
      # API 34 and 36, in the release start (no sound, no video: animations are off) as in the
      # integration test (runs 40761869354 and 40770595168, 28 Oct 2026); another project
      # measured the emulator lost with swiftshader_indirect and surviving with
      # swangle_indirect. -feature -Vulkan: no guest Vulkan (Flutter uses OpenGL ES on
      # emulators anyway). No -noaudio: the audio device goes to the host PulseAudio null sink
      # started below.
      EMULATOR_OPTIONS: -no-window -gpu swangle_indirect -feature -Vulkan -no-boot-anim -camera-back none
      # Read by tool/ci/emulator_checks.sh: same layout in dp as 1080 x 2400 at 420 dpi, with
      # 2.25 times fewer pixels for the software renderer to draw.
      EMULATOR_WM_SIZE: 720x1600
      EMULATOR_WM_DENSITY: "280"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The emulator needs memory too: cap the Gradle daemon below the project's 8 GB setting
      # (~/.gradle/gradle.properties wins over android/gradle.properties).
      - name: Gradle memory for a runner shared with the emulator
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' >> ~/.gradle/gradle.properties

      - name: Dependencies
        run: flutter pub get

      - name: Bundle the Premium audio and landscape media (demo build only)
        run: bash tool/ci/bundle_demo_media.sh

      - uses: actions/download-artifact@v4
        with:
          name: eventide-demo-emulator-x86_64
          path: dist/demo-emulator

      # Builds the integration test once before the emulator starts (Gradle and Kotlin warm,
      # most tasks up to date for flutter drive), then frees the Gradle daemon's memory.
      - name: Pre-build the integration test APK (debug demo, x86_64)
        run: |
          flutter build apk --debug --target-platform android-x64 \
            --target=integration_test/demo_flow_test.dart \
            --dart-define=DEMO_MODE=true --android-project-arg=eventide.demo=true
          (cd android && ./gradlew --stop) || true

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # v3: snapshot made with swangle_indirect and without guest Vulkan.
          key: avd-${{ matrix.api-level }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}-${{ env.AVD_PROFILE }}-v3

      # Without a host audio server the emulator logs « Could not init `pa' audio driver » and
      # falls back to a backend that may never consume the frames Android plays: audio writes
      # then block (seen by other projects; on 28 Oct 2026 the emulator died just after our app
      # started its sound, with -noaudio). A PulseAudio null sink consumes them in real time,
      # like a desktop's sound server. Local to the runner, nothing leaves it. Best effort: if it
      # cannot start, the emulator keeps its fallback and the job log says so.
      - name: Host audio server for the emulator (PulseAudio null sink, best effort)
        run: |
          install_pulse() { timeout 240 sudo apt-get install -y -qq --no-install-recommends pulseaudio pulseaudio-utils >/dev/null 2>&1; }
          if ! command -v pulseaudio >/dev/null; then
            install_pulse || { timeout 240 sudo apt-get update -qq >/dev/null 2>&1 && install_pulse; } || true
          fi
          dir="$RUNNER_TEMP/pulse"
          mkdir -p "$dir"
          if command -v pulseaudio >/dev/null; then
            pulseaudio --daemonize=yes --exit-idle-time=-1 --disallow-exit --use-pid-file=no -n \
              --log-target="file:$dir/pulse.log" \
              --load="module-native-protocol-unix socket=$dir/native auth-anonymous=1" \
              --load="module-null-sink sink_name=eventide_ci rate=48000 channels=2" || true
            for _ in $(seq 20); do [ -S "$dir/native" ] && break; sleep 0.5; done
          fi
          if pactl -s "unix:$dir/native" info >/dev/null 2>&1; then
            pactl -s "unix:$dir/native" set-default-sink eventide_ci || true
            pactl -s "unix:$dir/native" list short sinks
            # libpulse (PULSE_SERVER) and the emulator's PulseAudio driver (QEMU_PA_SERVER).
            echo "PULSE_SERVER=unix:$dir/native" >> "$GITHUB_ENV"
            echo "QEMU_PA_SERVER=unix:$dir/native" >> "$GITHUB_ENV"
          else
            tail -n 20 "$dir/pulse.log" 2>/dev/null || true
            echo "::warning title=Host audio (API ${{ matrix.api-level }})::no PulseAudio server: the emulator keeps its fallback audio backend"
          fi

      - name: Create the AVD and its snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # A: release demo APK starts (R8), B: integration test, C: scheduled start in background.
      # The script exits non-zero when A or B fails; C is reported by the next step.
      # disable-animations sets the animation scales to 0: Flutter then reports reduced motion,
      # so the landscapes show their still picture (no video is played on the emulator).
      - name: Release start, integration test and scheduled start on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ env.AVD_PROFILE }}
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: app
          script: bash tool/ci/emulator_checks.sh ../dist/demo-emulator/eventide-demo-emulator-x86_64.apk ../emulator-results/api-${{ matrix.api-level }}

      # Non-blocking: a scheduled start depends on the emulator's alarm and service timing.
      - name: Scheduled start verdict (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          result=../emulator-results/api-${{ matrix.api-level }}
          cat "$result/scheduled-start.txt" 2>/dev/null || echo "no scheduled-start report"
          status="$(cat "$result/scheduled-start.status" 2>/dev/null || echo fail)"
          if [ "$status" != "pass" ]; then
            echo "::warning title=Scheduled start (API ${{ matrix.api-level }})::the scheduled start was not confirmed, see the emulator-api-${{ matrix.api-level }} artifact"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api-level }}
          path: emulator-results/api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 14
