name: app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Proves that the Kotlin code (alarms, receivers, Play Integrity) and the Gradle setup
      # compile: this cannot be checked in environments without Google Maven access.
      - name: Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: eventide-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
