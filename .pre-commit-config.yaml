# Hooks exécutés avant chaque commit (repris de Candidature Express). Installation (une fois par
# poste) :
#   uv tool install pre-commit   (ou pipx install pre-commit)
#   pre-commit install
# Lancer sur tout le dépôt : pre-commit run --all-files
#
# Révisions épinglées par SHA de commit (le tag est en commentaire) ; mise à jour :
#   pre-commit autoupdate --freeze
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-check
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.(png|jpe?g|gif|ico|webp|svg|ogg|mp3|pdf)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(png|jpe?g|gif|ico|webp|svg|ogg|mp3|pdf)$
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Contenu de l'application (photos, sons) : versionné volontairement.
        exclude: ^app/assets/
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(png|jpe?g|gif|ico|webp|ogg|mp3|pdf)$
